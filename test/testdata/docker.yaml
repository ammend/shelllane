version: 1
shells:
  sh: /bin/sh
identity:
  env: SHELLLANE_IDENTITY
  required: true
state:
  root: STATE_ROOT
  identityNaming: hash
routes:
  - target: container
nodes:
  local:
    connector: local
runtimes:
  sandbox:
    type: container
    engine: docker
    image: alpine@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    user: "CONTAINER_USER"
    pullPolicy: missing
    workdir: /workspace
    network: restricted
    readOnly: true
    resources:
      cpus: "1"
      memory: 256m
      pids: 64
    passEnv:
      - SHELLLANE_CONTEXT_*
targets:
  container:
    node: local
    runtime: sandbox
audit:
  path: AUDIT_PATH
