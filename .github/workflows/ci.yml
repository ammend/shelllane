name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - run: make integration
      - run: make docker-integration
      - run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          make ssh-integration
      - run: go build -trimpath ./cmd/shelllane
